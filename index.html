            if (completedCount) {
                let totalClicks = Object.values(userCompletedTasks).reduce((a, b) => a + b, 0);
                completedCount.textContent = totalClicks;
            }

            document.getElementById("referralCount").textContent = userReferralsCount;
            document.getElementById("totalReferralsVal").textContent = userReferralsCount;
            
            let calculatedRefEarnings = userReferralsCount * REFERRAL_RATE;
            document.getElementById("referralEarningsVal").textContent = calculatedRefEarnings.toFixed(2);

            updateTaskButtons();
        }

        async function loadActiveTasksFromServer() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks/active`);
                const data = await response.json();
                
                const tasksContainer = document.getElementById('all-tasks-container');
                const featuredContainer = document.getElementById('featured-tasks-container');
                
                tasksContainer.innerHTML = ''; featuredContainer.innerHTML = '';

                if (!data.success || !data.tasks || data.tasks.length === 0) {
                    tasksContainer.innerHTML = '<p style="text-align:center;color:#777;padding:10px;">No tasks available right now.</p>';
                    featuredContainer.innerHTML = '<p style="text-align:center;color:#777;padding:10px;">No featured tasks available.</p>';
                    return;
                }

                TASKS = {};
                let count = 0;

                data.tasks.forEach(task => {
                    const taskId = task._id || task.id;
                    TASKS[taskId] = task;

                    const completedCount = userCompletedTasks[taskId] || 0;
                    let maxLimit = task.category === 'Website' ? 20 : 3; // থার্ডপার্টি ২০ বার, সোশ্যাল ৩ বার
                    let isLimitOver = completedCount >= maxLimit;

                    const taskHtml = `
                        <div class="task-card">
                            <div class="task-top">
                                <div class="task-icon">${task.icon || '🎯'}</div>
                                <div class="task-info">
                                    <div class="task-title">${task.title}</div>
                                    <div class="task-description">${task.description || 'Complete task.'}</div>
                                    <div class="task-reward">+${task.reward} TaskCoins</div>
                                    <div class="task-limit-badge">Limit: ${completedCount}/${maxLimit} Used</div>
                                </div>
                            </div>
                            <button class="task-btn ${isLimitOver ? 'completed' : ''}" data-task="${taskId}" ${isLimitOver ? 'disabled' : ''}>
                                ${isLimitOver ? '✓ Daily Limit Over' : 'Start Task'}
                            </button>
                        </div>
                    `;

                    tasksContainer.insertAdjacentHTML('beforeend', taskHtml);
                    if (count < 2) { featuredContainer.insertAdjacentHTML('beforeend', taskHtml); count++; }
                });

                document.querySelectorAll(".task-btn").forEach(button => {
                    button.onclick = function() { openTask(button.getAttribute("data-task")); };
                });

            } catch (error) { console.error("Error Rendering Tasks:", error); }
        }

        function openTask(taskId) {
            const task = TASKS[taskId];
            if (!task) return;

            const completedCount = userCompletedTasks[taskId] || 0;
            let maxLimit = task.category === 'Website' ? 20 : 3;

            if (completedCount >= maxLimit) {
                showToast("Daily limit reached for this task.");
                return;
            }

            currentTaskId = taskId;
            remainingTime = task.duration || 10;

            document.getElementById("modalTaskIcon").textContent = task.icon || "🎯";
            document.getElementById("modalTaskTitle").textContent = task.title;
            document.getElementById("modalTaskDescription").textContent = task.description;
            document.getElementById("modalTaskReward").textContent = "+" + task.reward + " TaskCoins";
            document.getElementById("timerText").textContent = remainingTime;

            const claimBtn = document.getElementById("claimBtn");
            claimBtn.disabled = true;
            document.getElementById("taskModal").classList.add("show");

            if (task.url) {
                if (tg && tg.openLink) { tg.openLink(task.url); } else { window.open(task.url, '_blank'); }
            }

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingTime--;
                document.getElementById("timerText").textContent = remainingTime;
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    claimBtn.disabled = false;
                    showToast("Task completed! Claim reward.");
                }
            }, 1000);
        }

        function closeTaskModal() {
            clearInterval(timerInterval);
            timerInterval = null; currentTaskId = null;
            document.getElementById("taskModal").classList.remove("show");
        }

        async function claimReward() {
            if (!currentTaskId) return;
            const task = TASKS[currentTaskId];
            const tId = telegramUser ? telegramUser.id : "test_12345";

            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks/complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: String(tId), taskId: currentTaskId, reward: task.reward })
                });
                const result = await response.json();

                if (result.success) {
                    closeTaskModal();
                    showToast("+" + task.reward + " TaskCoins added!");
                    await syncUserData();
                    await loadActiveTasksFromServer();
                } else { alert(result.message || "Failed to process reward claim."); }
            } catch (error) { console.error("Claim Transaction Error:", error); }
        }

        function updateTaskButtons() {
            document.querySelectorAll(".task-btn").forEach(button => {
                const taskId = button.getAttribute("data-task");
                const task = TASKS[taskId];
                if (task) {
                    const completedCount = userCompletedTasks[taskId] || 0;
                    let maxLimit = task.category === 'Website' ? 20 : 3;
                    if (completedCount >= maxLimit) {
                        button.textContent = "✓ Daily Limit Over";
                        button.classList.add("completed");
                                    button.disabled = true;
                    } else {
                        button.textContent = "Start Task";
                        button.classList.remove("completed");
                        button.disabled = false;
                    }
                }
            });
        }

        // ==========================================
        // 4. SECURE 1000 COIN WITHDRAWAL VALIDATION
        // ==========================================
        async function requestWithdraw() {
            const amountInput = document.getElementById("withdrawAmount");
            const methodInput = document.getElementById("withdrawMethod");
            const accountInput = document.getElementById("withdrawAccount");

            const amount = Number(amountInput.value);
            const method = methodInput.value;
            const account = accountInput.value.trim();

            if (!amount || amount < 1000) { showToast("Minimum withdrawal is 1000 TaskCoins."); return; }
            if (amount > currentBalanceValue) { showToast("Insufficient wallet balance."); return; }
            if (!method || !account) { showToast("Please completely fill out all input fields."); return; }

            const tId = telegramUser ? telegramUser.id : "test_12345";

            try {
                const response = await fetch(`${API_BASE_URL}/api/withdrawals/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: String(tId), amount: amount, method: method, account: account })
                });
                const result = await response.json();

                if (result.success) {
                    alert("Success! Your withdrawal request has been sent to the Admin Panel.");
                    amountInput.value = ""; methodInput.value = ""; accountInput.value = "";
                    await syncUserData(); 
                } else { alert(result.message || "Request submission failed."); }
            } catch (error) { alert("Server connection issue."); }
        }

        // Bind Actions
        document.getElementById("claimBtn").onclick = claimReward;
        document.getElementById("copyReferralBtn").onclick = copyReferralCode;

        // Bootstrap Initial Trigger
        window.onload = async function() {
            loadTelegramProfile();
            await syncUserData();
            await loadActiveTasksFromServer();
        };
    </script>
</body>
</html>

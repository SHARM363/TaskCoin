<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskCoin Character Logo Upload</title>
<style>body{font-family:system-ui,Arial;background:#f3f5f9;color:#172033;margin:0;padding:16px}.wrap{max-width:900px;margin:auto}.top,.item{background:white;border:1px solid #dbe1eb;border-radius:14px;padding:16px;margin:12px 0}.item{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center}.logo{width:64px;height:64px;object-fit:contain;border:1px solid #ddd;border-radius:10px;background:#fafafa}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:9px;background:#116bdf;color:white;padding:10px 14px;font-weight:700}input[type=file]{max-width:100%}.status{font-size:13px;color:#586174;margin-top:6px}.error{color:#b42318}.ok{color:#067647}@media(max-width:480px){body{padding:8px}.item{grid-template-columns:56px 1fr;padding:10px}.logo{width:52px;height:52px}}</style></head>
<body><div class="wrap"><div class="top"><h2>TaskCoin — Character Logo Upload</h2><p>প্রতিটি ক্যারেক্টারের লোগো আলাদাভাবে নির্বাচন করে Save করুন। PNG/JPG/WebP/GIF/SVG, সর্বোচ্চ 512 KB।</p><div class="row"><label>Admin Token <input id="token" type="password" placeholder="Admin token" style="width:min(420px,75vw);padding:9px"></label><button onclick="loadCharacters()">Load / Refresh</button></div><div id="globalStatus" class="status"></div></div><div id="list">লোড হচ্ছে…</div></div>
<script>
const API='https://taskcoin-1.onrender.com';
const tokenInput=document.getElementById('token');
tokenInput.value=localStorage.getItem('taskcoin_admin_token')||'';
function headers(){const t=tokenInput.value.trim();if(t)localStorage.setItem('taskcoin_admin_token',t);return {'Content-Type':'application/json','Authorization':'Bearer '+t};}
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...headers(),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||('HTTP '+r.status));return d;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadCharacters(){const list=document.getElementById('list'),st=document.getElementById('globalStatus');list.textContent='লোড হচ্ছে…';st.className='status';try{const d=await api('/api/characters/admin/config');const chars=d.characters||[];list.innerHTML=chars.map(c=>`<section class="item"><img class="logo" id="preview${c.id}" src="${c.image_url?esc(c.image_url):''}" style="${c.image_url?'':'visibility:hidden'}"><div><h3 style="margin:0 0 8px">${esc(c.name)} <small>#${c.id}</small></h3><div class="row"><input id="file${c.id}" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" onchange="preview(${c.id})"><button onclick="saveLogo(${c.id})">Save Logo</button><button onclick="clearLogo(${c.id})" style="background:#64748b">Remove Logo</button></div><div id="status${c.id}" class="status">${c.image_url?'লোগো সংরক্ষিত':'এখনও লোগো নেই'}</div></div></section>`).join('')||'<p>কোনো ক্যারেক্টার পাওয়া যায়নি।</p>';st.textContent='মোট '+chars.length+'টি ক্যারেক্টার লোড হয়েছে।'}catch(e){list.innerHTML='<div class="top error">লোড করা যায়নি: '+esc(e.message)+'<br>Admin token ঠিক আছে কি না এবং Render API চালু আছে কি না দেখুন।</div>';st.textContent='';}}
function preview(id){const f=document.getElementById('file'+id).files[0];if(!f)return;if(f.size>512*1024){document.getElementById('status'+id).textContent='ফাইল 512 KB-এর বেশি। ছোট ছবি দিন।';document.getElementById('status'+id).className='status error';return;}const r=new FileReader();r.onload=()=>{const im=document.getElementById('preview'+id);im.src=r.result;im.style.visibility='visible';document.getElementById('status'+id).textContent='Preview — Save Logo চাপুন';};r.readAsDataURL(f);}
async function saveLogo(id){const st=document.getElementById('status'+id),f=document.getElementById('file'+id).files[0];if(!f){st.textContent='আগে একটি লোগো ফাইল নির্বাচন করুন।';st.className='status error';return;}if(f.size>512*1024){st.textContent='ফাইল 512 KB-এর বেশি।';st.className='status error';return;}try{st.textContent='সংরক্ষণ হচ্ছে…';st.className='status';const image_url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('ফাইল পড়া যায়নি'));r.readAsDataURL(f)});const d=await api('/api/characters/admin/config/'+id,{method:'PUT',body:JSON.stringify({image_url})});if(!d.logo_saved||!d.character?.image_url)throw Error('Server saved confirmation did not include the logo');st.textContent='সফল! লোগো ডাটাবেজে সংরক্ষিত হয়েছে।';st.className='status ok';document.getElementById('preview'+id).src=d.character.image_url;}catch(e){st.textContent='ব্যর্থ: '+e.message;st.className='status error';}}
async function clearLogo(id){if(!confirm('এই ক্যারেক্টারের লোগো মুছে ফেলবেন?'))return;const st=document.getElementById('status'+id);try{await api('/api/characters/admin/config/'+id,{method:'PUT',body:JSON.stringify({image_url:''})});const im=document.getElementById('preview'+id);im.removeAttribute('src');im.style.visibility='hidden';document.getElementById('file'+id).value='';st.textContent='লোগো মুছে ফেলা হয়েছে।';st.className='status ok';}catch(e){st.textContent='ব্যর্থ: '+e.message;st.className='status error';}}
loadCharacters();
</script></body></html>
